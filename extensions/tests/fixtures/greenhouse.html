<!DOCTYPE html>
<html>
  <head>
    <title>Jobs at Stripe</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "JobPosting",
        "title": "Backend Intern",
        "description": "<p>Work on billing APIs used by millions of businesses.</p><p>Requirements include Python and SQL.</p>",
        "hiringOrganization": {
          "@type": "Organization",
          "name": "Stripe"
        },
        "jobLocation": {
          "@type": "Place",
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "San Francisco",
            "addressRegion": "CA"
          }
        }
      }
    </script>
    <meta property="og:title" content="Backend Intern at Stripe..." />
    <meta property="og:description" content="Join Stripe." />
  </head>
  <body>
    <h1 class="app-title">Backend Intern</h1>
    <span class="company-name">Stripe</span>
    <div id="content">
      <p>Work on billing APIs used by millions of businesses.</p>
      <p>Requirements include Python and SQL.</p>
    </div>
  </body>
</html>
